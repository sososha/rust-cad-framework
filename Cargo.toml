[workspace]
members = [
    "crates/*",
    "apps/*",
]
resolver = "2"

[workspace.dependencies]
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
cgmath = "0.18"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
env_logger = "0.11.8"
slotmap = "1.0"
thiserror = "1.0"
